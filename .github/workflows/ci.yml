name: ArenaLive CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript build
        run: npm run build

      - name: Test suite
        run: npm test -- --passWithNoTests

      - name: Backend health smoke test
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=test PORT=4010 node dist/backend/src/server.js > /tmp/arenalive-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4010/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arenalive-server.log
          exit 1
